  <!-- React & ReactDOM -->

<body class="bg-[#111813] dark:bg-[#111813] text-slate-100 min-h-screen font-sans antialiased transition-colors duration-300" id="bodyTag">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- COOKIES & LOCALSTORAGE HELPERS ---
    const setCookie = (name, value, days = 365) => {
      let expires = "";
      if (days) {
        const date = new Date();
        date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
        expires = "; expires=" + date.toUTCString();
      }
      document.cookie = name + "=" + (encodeURIComponent(value) || "") + expires + "; path=/; SameSite=Lax";
    };

    const getCookie = (name) => {
      const nameEQ = name + "=";
      const ca = document.cookie.split(';');
      for (let i = 0; i < ca.length; i++) {
        let c = ca[i];
        while (c.charAt(0) === ' ') c = c.substring(1, c.length);
        if (c.indexOf(nameEQ) === 0) return decodeURIComponent(c.substring(nameEQ.length, c.length));
      }
      return null;
    };

    const getStoredValue = (key) => getCookie(key) || localStorage.getItem(key) || "";
    const saveStoredValue = (key, value) => {
      if (value) {
        setCookie(key, value, 365);
        localStorage.setItem(key, value);
      }
    };

    const DEFAULT_SUPABASE_URL = getStoredValue("supabase_url");
    const DEFAULT_SUPABASE_KEY = getStoredValue("supabase_key");

    const INITIAL_DOMAINS_CONFIG = [
      {
        id: 1,
        title: "1. Communication & Collaboration",
        objective: "Assurer une communication claire et efficace avec l'équipe, les chefs de projet et les clients.",
        skills: [
          "Communication écrite et orale claire.",
          "Remontée proactive des blocages.",
          "Partage des informations importantes.",
          "Participation active aux réunions.",
          "Esprit d'équipe et entraide.",
          "Transmission des connaissances aux autres membres."
        ]
      },
      {
        id: 2,
        title: "2. Organisation & Gestion des priorités",
        objective: "Respecter les engagements et gérer efficacement sa charge de travail.",
        skills: [
          "Organisation personnelle.",
          "Gestion des priorités.",
          "Respect des délais.",
          "Mise à jour régulière des tâches (Taiga, Jira, etc.).",
          "Anticipation des risques et dépendances.",
          "Capacité à travailler sur plusieurs sujets simultanément."
        ]
      },
      {
        id: 3,
        title: "3. Qualité & Responsabilité",
        objective: "Garantir un travail fiable et limiter les régressions.",
        skills: [
          "Contrôle qualité avant livraison.",
          "Vérification des impacts fonctionnels.",
          "Documentation des actions réalisées.",
          "Respect des processus de production.",
          "Sens des responsabilités.",
          "Capacité à assumer ses erreurs et proposer des solutions."
        ]
      },
      {
        id: 4,
        title: "4. Autonomie & Prise d'initiative",
        objective: "Développer l'autonomie tout en respectant le cadre défini.",
        skills: [
          "Recherche de solutions avant d'escalader.",
          "Analyse des problèmes.",
          "Force de proposition.",
          "Capacité à prendre des décisions sur les sujets maîtrisés."
        ]
      },
      {
        id: 5,
        title: "5. Problem solving",
        objective: "Résoudre les problèmes efficacement.",
        skills: [
          "Analyse des causes racines.",
          "Diagnostic méthodique.",
          "Proposition de plusieurs solutions.",
          "Évaluation des risques.",
          "Capitalisation des retours d'expérience."
        ]
      },
      {
        id: 6,
        title: "6. Compétences techniques métier",
        objective: "Maîtriser les fondamentaux de la plateforme et des processus métier.",
        skills: [
          "Gestion de données (BDD, relations entités, analyse, cohérence).",
          "Comptabilité & Facturation (Devis, commande, facture, avoir, TVA).",
          "Produit / Klipso (BO, formulaires, exposants, campagnes, signalements)."
        ],
        skillCategories: {} 
      },
      {
        id: 7,
        title: "7. Suivi & Reporting",
        objective: "Donner de la visibilité à l'équipe et à la direction.",
        skills: [
          "Reporting régulier.",
          "Remontée des alertes.",
          "Estimation des charges.",
          "Suivi de l'avancement.",
          "Respect des engagements annoncés."
        ]
      }
    ];

    const createDefaultRatings = (domainsConfig) => {
      const ratings = {};
      domainsConfig.forEach(d => {
        d.skills.forEach(s => {
          ratings[`${d.id}_${s}`] = 0;
        });
      });
      return ratings;
    };

    const initialMembers = [
      {
        id: "lm",
        name: "Léa Martin",
        role: "Chef de projet",
        department: "PROD",
        initials: "LM",
        ratings: createDefaultRatings(INITIAL_DOMAINS_CONFIG)
      },
      {
        id: "yk",
        name: "Yassine Karray",
        role: "Support & Production",
        department: "TMA",
        initials: "YK",
        ratings: createDefaultRatings(INITIAL_DOMAINS_CONFIG)
      }
    ];

    function App() {
      // --- GESTION DE LA SESSION & AUTHENTIFICATION (2 jours d'expiration) ---
      const [isAuthenticated, setIsAuthenticated] = useState(() => {
        const sessionData = sessionStorage.getItem("app_user_session");
        if (!sessionData) return false;
        try {
          const parsed = JSON.parse(sessionData);
          const now = new Date().getTime();
          const twoDaysInMs = 2 * 24 * 60 * 60 * 1000;
          // Vérification si la session a plus de 2 jours d'inactivité
          if (now - parsed.timestamp > twoDaysInMs) {
            sessionStorage.removeItem("app_user_session");
            return false;
          }
          return true;
        } catch (e) {
          return false;
        }
      });

      const [loginUser, setLoginUser] = useState("");
      const [loginPass, setLoginPass] = useState("");
      const [loginError, setLoginError] = useState("");

      // Identifiants configurables par défaut (À modifier selon vos besoins)
      const ADMIN_USER = "prod";
      const ADMIN_PASS = "admin123";

      const handleLogin = (e) => {
        e.preventDefault();
        if (loginUser === ADMIN_USER && loginPass === ADMIN_PASS) {
          const sessionPayload = {
            user: loginUser,
            timestamp: new Date().getTime()
          };
          sessionStorage.setItem("app_user_session", JSON.stringify(sessionPayload));
          setIsAuthenticated(true);
          setLoginError("");
        } else {
          setLoginError("Identifiant ou mot de passe incorrect.");
        }
      };

      const handleLogout = () => {
        sessionStorage.removeItem("app_user_session");
        setIsAuthenticated(false);
      };

      // Rafraîchir le timestamp de session à chaque interaction si authentifié
      useEffect(() => {
        if (isAuthenticated) {
          const updateActivity = () => {
            const sessionData = sessionStorage.getItem("app_user_session");
            if (sessionData) {
              try {
                const parsed = JSON.parse(sessionData);
                parsed.timestamp = new Date().getTime();
                sessionStorage.setItem("app_user_session", JSON.stringify(parsed));
              } catch (e) {}
            }
          };
          window.addEventListener("click", updateActivity);
          window.addEventListener("keypress", updateActivity);
          return () => {
            window.removeEventListener("click", updateActivity);
            window.removeEventListener("keypress", updateActivity);
          };
        }
      }, [isAuthenticated]);

      const [isDarkMode, setIsDarkMode] = useState(() => {
        const savedTheme = getStoredValue("app_theme");
        return savedTheme ? savedTheme === "dark" : true;
      });

      useEffect(() => {
        const rootEl = document.getElementById("htmlRoot");
        const bodyEl = document.getElementById("bodyTag");
        if (isDarkMode) {
          rootEl.classList.add("dark");
          bodyEl.style.backgroundColor = "#111813";
          bodyEl.style.color = "#f1f5f9";
          saveStoredValue("app_theme", "dark");
        } else {
          rootEl.classList.remove("dark");
          bodyEl.style.backgroundColor = "#f8fafc";
          bodyEl.style.color = "#0f172a";
          saveStoredValue("app_theme", "light");
        }
      }, [isDarkMode]);

      const [supabaseUrl, setSupabaseUrl] = useState(DEFAULT_SUPABASE_URL);
      const [supabaseKey, setSupabaseKey] = useState(DEFAULT_SUPABASE_KEY);
      const [supabaseClient, setSupabaseClient] = useState(null);
      const [syncStatus, setSyncStatus] = useState("idle"); 
      const [showSettings, setShowSettings] = useState(!DEFAULT_SUPABASE_URL);

      const [domainsConfig, setDomainsConfig] = useState(INITIAL_DOMAINS_CONFIG);
      const [members, setMembers] = useState(initialMembers);
      
      const [selectedDepartments, setSelectedDepartments] = useState(["ALL"]);

      const [activeModal, setActiveModal] = useState(null);
      const [editingMember, setEditingMember] = useState(null);

      const [formName, setFormName] = useState("");
      const [formRole, setFormRole] = useState("");
      const [formDepartment, setFormDepartment] = useState("PROD");
      const [formRatings, setFormRatings] = useState({});
      const [openAccordion, setOpenAccordion] = useState(1);
      const [newSkillInput, setNewSkillInput] = useState({});

      const [showMetierModal, setShowMetierModal] = useState(false);
      const [metierSkillName, setMetierSkillName] = useState("");
      const [metierSkillCategory, setMetierSkillCategory] = useState("all");
      const [editingMetierSkill, setEditingMetierSkill] = useState(null);

      useEffect(() => {
        if (isAuthenticated && supabaseUrl && supabaseKey) {
          try {
            const client = window.supabase.createClient(supabaseUrl, supabaseKey);
            setSupabaseClient(client);
            saveStoredValue("supabase_url", supabaseUrl);
            saveStoredValue("supabase_key", supabaseKey);
            fetchDataFromCloud(client);

            const channel = client
              .channel('app_state_changes')
              .on('postgres_changes', { event: '*', schema: 'public', table: 'app_state' }, payload => {
                if (payload.new && payload.new.content) {
                  if (payload.new.content.members) setMembers(payload.new.content.members);
                  if (payload.new.content.domainsConfig) setDomainsConfig(payload.new.content.domainsConfig);
                }
              })
              .subscribe();

            return () => { client.removeChannel(channel); };
          } catch (e) {
            console.error("Erreur de connexion Supabase:", e);
            setSyncStatus("error");
          }
        } else {
          setSyncStatus("idle");
        }
      }, [isAuthenticated, supabaseUrl, supabaseKey]);

      const fetchDataFromCloud = async (client) => {
        setSyncStatus("syncing");
        try {
          const { data, error } = await client.from('app_state').select('*').eq('id', 1).single();
          if (data && data.content) {
            if (data.content.members) setMembers(data.content.members);
            if (data.content.domainsConfig) setDomainsConfig(data.content.domainsConfig);
            setSyncStatus("connected");
          } else if (error && error.code === 'PGRST116') {
            await saveToCloud(client, initialMembers, INITIAL_DOMAINS_CONFIG);
            setSyncStatus("connected");
          } else {
            setSyncStatus("connected");
          }
        } catch (e) {
          console.error("Erreur de lecture Cloud:", e);
          setSyncStatus("error");
        }
      };

      const saveToCloud = async (clientInstance, updatedMembers, updatedDomains) => {
        const client = clientInstance || supabaseClient;
        if (!client) return;

        setSyncStatus("syncing");
        try {
          const payload = {
            members: updatedMembers || members,
            domainsConfig: updatedDomains || domainsConfig
          };
          const { error } = await client.from('app_state').upsert({ id: 1, content: payload });
          if (error) throw error;
          setSyncStatus("connected");
        } catch (e) {
          console.error("Erreur de sauvegarde Supabase:", e);
          setSyncStatus("error");
        }
      };

      const getDomainSkillsForMember = (domain, member) => {
        if (domain.id !== 6) return domain.skills;
        const memberDept = (member.department || "PROD").toLowerCase();
        const cats = domain.skillCategories || {};

        return domain.skills.filter(s => {
          const cat = (cats[s] || "all").toLowerCase();
          return cat === "all" || cat === memberDept;
        });
      };

      const calculateMemberDomainScore = (member, domainId) => {
        const domain = domainsConfig.find(d => d.id === domainId);
        if (!domain) return 0;
        const activeSkills = getDomainSkillsForMember(domain, member);
        if (activeSkills.length === 0) return 0;

        let sum = 0;
        activeSkills.forEach(s => {
          sum += (member.ratings[`${domainId}_${s}`] || 0);
        });
        const max = activeSkills.length * 3;
        return max > 0 ? Math.round((sum / max) * 100) : 0;
      };

      const calculateMemberGlobalScore = (member) => {
        let totalSum = 0;
        let totalMax = 0;
        domainsConfig.forEach(d => {
          const activeSkills = getDomainSkillsForMember(d, member);
          activeSkills.forEach(s => {
            totalSum += (member.ratings[`${d.id}_${s}`] || 0);
            totalMax += 3;
          });
        });
        return totalMax > 0 ? Math.round((totalSum / totalMax) * 100) : 0;
      };

      const globalStats = useMemo(() => {
        if (members.length === 0) return { avgProgression: 0, masteredDomains: 0 };
        let sumGlobal = 0;
        let masteredCount = 0;

        members.forEach(m => {
          sumGlobal += calculateMemberGlobalScore(m);
          domainsConfig.forEach(d => {
            if (calculateMemberDomainScore(m, d.id) >= 80) {
              masteredCount++;
            }
          });
        });

        return {
          avgProgression: Math.round(sumGlobal / members.length),
          masteredDomains: masteredCount
        };
      }, [members, domainsConfig]);

      const filteredMembers = useMemo(() => {
        if (selectedDepartments.includes("ALL") || selectedDepartments.length === 0) {
          return members;
        }
        return members.filter(m => selectedDepartments.includes(m.department || "PROD"));
      }, [members, selectedDepartments]);

      const handleDepartmentFilterChange = (dept) => {
        if (dept === "ALL") {
          setSelectedDepartments(["ALL"]);
        } else {
          let updated;
          if (selectedDepartments.includes("ALL")) {
            updated = [dept];
          } else if (selectedDepartments.includes(dept)) {
            updated = selectedDepartments.filter(d => d !== dept);
            if (updated.length === 0) updated = ["ALL"];
          } else {
            updated = [...selectedDepartments, dept];
          }
          setSelectedDepartments(updated);
        }
      };

      const openAddModal = () => {
        setFormName("");
        setFormRole("");
        setFormDepartment("PROD");
        setFormRatings(createDefaultRatings(domainsConfig));
        setOpenAccordion(1);
        setActiveModal("ADD");
      };

      const openEditModal = (member) => {
        setEditingMember(member);
        setFormName(member.name);
        setFormRole(member.role);
        setFormDepartment(member.department || "PROD");
        setFormRatings({ ...member.ratings });
        setOpenAccordion(1);
        setActiveModal("EDIT");
      };

      const handleSave = (e) => {
        e.preventDefault();
        if (!formName) return;

        const initials = formName.split(" ").map(n => n[0]).join("").toUpperCase().slice(0, 2) || "XX";
        let newMembersList = [];

        if (activeModal === "ADD") {
          const newM = {
            id: Date.now().toString(),
            name: formName,
            role: formRole,
            department: formDepartment,
            initials,
            ratings: formRatings
          };
          newMembersList = [...members, newM];
        } else if (activeModal === "EDIT") {
          newMembersList = members.map(m => m.id === editingMember.id ? {
            ...m,
            name: formName,
            role: formRole,
            department: formDepartment,
            initials,
            ratings: formRatings
          } : m);
        }

        setMembers(newMembersList);
        saveToCloud(null, newMembersList, domainsConfig);
        setActiveModal(null);
      };

      const handleDelete = (id) => {
        if (confirm("Voulez-vous vraiment supprimer ce membre ?")) {
          const filtered = members.filter(m => m.id !== id);
          setMembers(filtered);
          saveToCloud(null, filtered, domainsConfig);
        }
      };

      const setRatingValue = (key, val) => {
        setFormRatings(prev => ({ ...prev, [key]: val }));
      };

      const handleAddCustomSkill = (domainId) => {
        const skillName = newSkillInput[domainId]?.trim();
        if (!skillName) return;

        const updatedDomains = domainsConfig.map(d => {
          if (d.id === domainId && !d.skills.includes(skillName)) {
            return { ...d, skills: [...d.skills, skillName] };
          }
          return d;
        });

        setDomainsConfig(updatedDomains);
        setFormRatings(prev => ({ ...prev, [`${domainId}_${skillName}`]: 0 }));
        setNewSkillInput(prev => ({ ...prev, [domainId]: "" }));

        saveToCloud(null, members, updatedDomains);
      };

      const handleSaveMetierSkill = () => {
        const name = metierSkillName.trim();
        if (!name) return;

        let updatedDomains;
        let updatedMembers = [...members];

        if (editingMetierSkill) {
          const oldName = editingMetierSkill;
          updatedDomains = domainsConfig.map(d => {
            if (d.id === 6) {
              const existingCats = d.skillCategories || {};
              const newCats = { ...existingCats };
              if (oldName !== name) {
                delete newCats[oldName];
              }
              newCats[name] = metierSkillCategory;
              
              const newSkills = d.skills.map(s => s === oldName ? name : s);
              if (!newSkills.includes(name)) {
                newSkills.unshift(name);
              }
              return { ...d, skills: newSkills, skillCategories: newCats };
            }
            return d;
          });

          if (oldName !== name) {
            updatedMembers = members.map(m => {
              const newR = { ...m.ratings };
              newR[`6_${name}`] = newR[`6_${oldName}`] || 0;
              delete newR[`6_${oldName}`];
              return { ...m, ratings: newR };
            });
          }
        } else {
          updatedDomains = domainsConfig.map(d => {
            if (d.id === 6) {
              const existingCats = d.skillCategories || {};
              const newCats = { ...existingCats, [name]: metierSkillCategory };
              const newSkills = [name, ...d.skills.filter(s => s !== name)];
              return { ...d, skills: newSkills, skillCategories: newCats };
            }
            return d;
          });

          updatedMembers = members.map(m => {
            const newR = { ...m.ratings, [`6_${name}`]: 0 };
            return { ...m, ratings: newR };
          });
        }

        setDomainsConfig(updatedDomains);
        setMembers(updatedMembers);
        setMetierSkillName("");
        setMetierSkillCategory("all");
        setEditingMetierSkill(null);

        saveToCloud(null, updatedMembers, updatedDomains);
      };

      const handleStartEditMetierSkill = (skillName, currentCat) => {
        setEditingMetierSkill(skillName);
        setMetierSkillName(skillName);
        setMetierSkillCategory(currentCat || "all");
      };

      const handleDeleteMetierSkill = (skillName) => {
        if (!confirm(`Voulez-vous vraiment supprimer la compétence métier "${skillName}" ?`)) return;

        const updatedDomains = domainsConfig.map(d => {
          if (d.id === 6) {
            const newCats = { ...(d.skillCategories || {}) };
            delete newCats[skillName];
            return { 
              ...d, 
              skills: d.skills.filter(s => s !== skillName),
              skillCategories: newCats
            };
          }
          return d;
        });

        const updatedMembers = members.map(m => {
          const newR = { ...m.ratings };
          delete newR[`6_${skillName}`];
          return { ...m, ratings: newR };
        });

        setDomainsConfig(updatedDomains);
        setMembers(updatedMembers);
        if (editingMetierSkill === skillName) {
          setEditingMetierSkill(null);
          setMetierSkillName("");
          setMetierSkillCategory("all");
        }

        saveToCloud(null, updatedMembers, updatedDomains);
      };

      const handleRemoveSkill = (domainId, skillName) => {
        const updatedDomains = domainsConfig.map(d => {
          if (d.id === domainId) {
            const newCats = { ...(d.skillCategories || {}) };
            delete newCats[skillName];
            return { 
              ...d, 
              skills: d.skills.filter(s => s !== skillName),
              skillCategories: newCats
            };
          }
          return d;
        });
        setDomainsConfig(updatedDomains);
        saveToCloud(null, members, updatedDomains);
      };

      const handleUpdateObjective = (domainId, newObjective) => {
        const updatedDomains = domainsConfig.map(d => {
          if (d.id === domainId) {
            return { ...d, objective: newObjective };
          }
          return d;
        });
        setDomainsConfig(updatedDomains);
        saveToCloud(null, members, updatedDomains);
      };

      const exportToExcel = () => {
        const wb = XLSX.utils.book_new();
        const summaryData = members.map(m => {
          const row = {
            "Membre": m.name,
            "Rôle": m.role,
            "Département": m.department || "PROD",
            "Score Global (%)": `${calculateMemberGlobalScore(m)}%`
          };
          domainsConfig.forEach(d => {
            row[d.title] = `${calculateMemberDomainScore(m, d.id)}%`;
          });
          return row;
        });
        const wsSummary = XLSX.utils.json_to_sheet(summaryData);
        XLSX.utils.book_append_sheet(wb, wsSummary, "Synthèse Équipe");

        const detailData = [];
        members.forEach(m => {
          domainsConfig.forEach(d => {
            const activeSkills = getDomainSkillsForMember(d, m);
            activeSkills.forEach(s => {
              const val = m.ratings[`${d.id}_${s}`] || 0;
              const labels = ["0 - À développer", "1 - En progrès", "2 - Maîtrisé", "3 - Expert"];
              detailData.push({
                "Membre": m.name,
                "Département": m.department || "PROD",
                "Domaine": d.title,
                "Compétence": s,
                "Note (0-3)": val,
                "Niveau": labels[val]
              });
            });
          });
        });
        const wsDetail = XLSX.utils.json_to_sheet(detailData);
        XLSX.utils.book_append_sheet(wb, wsDetail, "Détail Compétences");

        XLSX.writeFile(wb, "Carnet_de_croissance_equipe.xlsx");
      };

      const exportToPPTX = () => {
        const pptx = new PptxGenJS();
        pptx.layout = 'LAYOUT_16x9';

        let slideCover = pptx.addSlide();
        slideCover.background = { color: "111813" };
        slideCover.addText("Carnet de croissance", { x: 0.8, y: 1.5, fontSize: 32, bold: true, color: "4ADE80" });
        slideCover.addText("Suivi des compétences et objectifs de l'équipe, par domaine", { x: 0.8, y: 2.3, fontSize: 16, color: "94A3B8" });

                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Département</label>
                      <select
                        className="w-full bg-slate-50 dark:bg-[#1A2E22] border border-slate-300 dark:border-[#23382B] rounded-lg px-4 py-2.5 text-slate-800 dark:text-slate-100 outline-none focus:border-[#4ADE80]"
                        value={formDepartment}
                        onChange={e => setFormDepartment(e.target.value)}
                      >
                        <option value="PROD">PROD</option>
                        <option value="TMA">TMA</option>
                        <option value="ONSITE">ONSITE</option>
                      </select>
                    </div>
                  </div>

                  <div className="space-y-3 pt-2">
                    {domainsConfig.map(domain => {
                      const isOpen = openAccordion === domain.id;
                      const dummyMember = { department: formDepartment, ratings: formRatings };
                      const activeSkills = getDomainSkillsForMember(domain, dummyMember);

                      let sum = 0;
                      activeSkills.forEach(s => sum += (formRatings[`${domain.id}_${s}`] || 0));
                      const max = activeSkills.length * 3;
                      const scorePct = max > 0 ? Math.round((sum / max) * 100) : 0;

                      return (
                        <div key={domain.id} className="border border-slate-200 dark:border-[#23382B] rounded-xl overflow-hidden bg-slate-50 dark:bg-[#111813]">
                          <div 
                            onClick={() => setOpenAccordion(isOpen ? null : domain.id)}
                            className="p-4 cursor-pointer flex justify-between items-center hover:bg-slate-100 dark:hover:bg-[#1A2E22] transition"
                          >
                            <div className="flex-1 pr-4">
                              <h3 className="font-bold text-slate-800 dark:text-slate-100 text-base">{domain.title}</h3>
                              <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">{domain.objective}</p>
                            </div>
                            <div className="flex items-center gap-3">
                              <span className="text-emerald-600 dark:text-[#4ADE80] font-bold">{scorePct}%</span>
                              <span className="text-slate-400">{isOpen ? "▲" : "▼"}</span>
                            </div>
                          </div>

                          {isOpen && (
                            <div className="p-4 border-t border-slate-200 dark:border-[#23382B] space-y-4 bg-white dark:bg-[#16221A]">
                              
                              <div className="bg-slate-100 dark:bg-[#111813] p-3 rounded-lg border border-slate-200 dark:border-[#23382B] space-y-1">
                                <label className="text-[10px] uppercase font-bold text-slate-400">Objectif du Domaine</label>
                                <input 
                                  type="text" 
                                  className="w-full bg-transparent text-xs text-slate-700 dark:text-slate-300 outline-none"
                                  value={domain.objective}
                                  onChange={e => handleUpdateObjective(domain.id, e.target.value)}
                                  placeholder="Modifier l'objectif..."
                                />
                              </div>

                              <div className="space-y-3">
                                {activeSkills.map(skill => {
                                  const key = `${domain.id}_${skill}`;
                                  const currentVal = formRatings[key] || 0;
                                  const skillCat = domain.id === 6 ? (domain.skillCategories?.[skill] || "all") : null;

                                  return (
                                    <div key={skill} className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-2 border-b border-slate-100 dark:border-[#23382B]/50 last:border-0">
                                      <div className="flex items-center justify-between sm:justify-start gap-2 flex-1 pr-2">
                                        <div className="flex items-center gap-2">
                                          <span className="text-slate-700 dark:text-slate-300 font-medium text-xs sm:text-sm">{skill}</span>
                                          {skillCat && (
                                            <span className="text-[9px] uppercase px-1.5 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-semibold">
                                              {skillCat}
                                            </span>
                                          )}
                                        </div>
                                        {domain.id !== 6 && (
                                          <button 
                                            type="button"
                                            onClick={() => handleRemoveSkill(domain.id, skill)}
                                            className="text-slate-400 hover:text-red-500 text-xs px-1"
                                            title="Supprimer"
                                          >
                                            ✕
                                          </button>
                                        )}
                                      </div>
                                      
                                      <div className="flex items-center gap-1 bg-slate-100 dark:bg-[#111813] p-1 rounded-lg border border-slate-200 dark:border-[#23382B]">
                                        {[0, 1, 2, 3].map(level => (
                                          <button
                                            key={level}
                                            type="button"
                                            onClick={() => setRatingValue(key, level)}
                                            className={`w-7 h-7 rounded text-xs font-bold transition ${
                                              currentVal === level 
                                                ? "bg-[#4ADE80] text-slate-950 shadow" 
                                                : "text-slate-500 hover:text-black dark:hover:text-white"
                                            }`}
                                          >
                                            {level}
                                          </button>
                                        ))}
                                      </div>
                                    </div>
                                  );
                                })}
                              </div>

                              {domain.id !== 6 && (
                                <div className="pt-2 flex items-center gap-2">
                                  <input 
                                    type="text" 
                                    placeholder="+ Ajouter une compétence..." 
                                    className="flex-1 bg-slate-50 dark:bg-[#111813] border border-slate-200 dark:border-[#23382B] rounded-lg px-3 py-1.5 text-xs text-slate-800 dark:text-slate-200 outline-none focus:border-[#4ADE80]"
                                    value={newSkillInput[domain.id] || ""}
                                    onChange={e => setNewSkillInput({ ...newSkillInput, [domain.id]: e.target.value })}
                                    onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); handleAddCustomSkill(domain.id); }}}
                                  />
                                  <button 
                                    type="button"
                                    onClick={() => handleAddCustomSkill(domain.id)}
                                    className="px-3 py-1.5 bg-slate-200 dark:bg-[#23382B] hover:bg-[#34D399] hover:text-slate-950 text-slate-800 dark:text-[#4ADE80] rounded-lg text-xs font-semibold transition"
                                  >
                                    Ajouter
                                  </button>
                                </div>
                              )}

                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>

                </form>

                <div className="p-4 border-t border-slate-200 dark:border-[#23382B] flex justify-end gap-3 bg-slate-50 dark:bg-[#111813]">
                  <button 
                    type="button" 
                    onClick={() => setActiveModal(null)} 
                    className="px-4 py-2 text-sm text-slate-500 dark:text-slate-400 hover:text-black dark:hover:text-white transition"
                  >
                    Annuler
                  </button>
                  <button 
                    type="submit" 
                    form="memberForm"
                    className="px-5 py-2 bg-[#4ADE80] hover:bg-[#22C55E] text-slate-950 text-sm font-semibold rounded-lg shadow transition"
                  >
                    Enregistrer
                  </button>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
